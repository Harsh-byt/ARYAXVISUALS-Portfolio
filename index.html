    /* Scroll Text Reveal Animation */
.scroll-reveal {
  opacity: 0 !important;
  transform: translate3d(0, 45px, 0) !important;
  filter: blur(8px) !important;
  transition:
    opacity 0.75s ease-out,
    transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
    filter 0.75s ease-out !important;
  will-change: opacity, transform, filter;
}

.scroll-reveal.is-visible {
  opacity: 1 !important;
  transform: translate3d(0, 0, 0) !important;
  filter: blur(0) !important;
}

/* Hero headline: reveal on initial page load, not on scroll */
.hero-load-reveal {
  opacity: 0 !important;
  transform: translate3d(0, 45px, 0) !important;
  filter: blur(8px) !important;
  transition:
    opacity 0.85s ease-out,
    transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
    filter 0.85s ease-out !important;
  will-change: opacity, transform, filter;
}

.hero-load-reveal.hero-load-visible {
  opacity: 1 !important;
  transform: translate3d(0, 0, 0) !important;
  filter: blur(0) !important;
}

/* Long Form / Short Form page heading: reveal on page load */
.page-load-reveal {
  opacity: 0 !important;
  transform: translate3d(0, 40px, 0) !important;
  filter: blur(8px) !important;
  transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), filter 0.8s ease-out !important;
  will-change: opacity, transform, filter;
}

.page-load-reveal.page-load-visible {
  opacity: 1 !important;
  transform: translate3d(0, 0, 0) !important;
  filter: blur(0) !important;
}

.page-load-reveal-delay {
  transition-delay: 0.14s !important;
}

/* Stagger delays */
.scroll-reveal.delay-1 { transition-delay: 0.10s !important; }
.scroll-reveal.delay-2 { transition-delay: 0.20s !important; }
.scroll-reveal.delay-3 { transition-delay: 0.30s !important; }
.scroll-reveal.delay-4 { transition-delay: 0.40s !important; }
.scroll-reveal.delay-5 { transition-delay: 0.50s !important; }

      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.55);
      font-size: 16px;
      line-height: 1;
      transition: transform .25s ease, background .25s ease, color .25s ease;
    }
    .faq-item[open] .faq-plus {
      transform: rotate(45deg);
      background: #FF0E2B;
      color: #fff;
      border-color: #FF0E2B;

      padding: 0 18px 17px;
      font-size: 12px;

  <script>
(function () {
  function prepareTextAnimations() {
    /* Animate important text across the site.
       HERO H1 is intentionally included so CRAFTING / VISUALS / THAT / STOP SCROLLS reveal together.
       The skills marquee is intentionally excluded so its moving text stays clean. */
    document.querySelectorAll("#root h1, #root h2, #root h3, #root p, #root .syne").forEach(function (el) {
      if (el.closest("header, nav")) return;
      if (el.closest(".skills-marquee, .reviews-marquee")) return;

      // Keep the Home portfolio cards completely static.
      var card = el.closest(".group");
      if (card && (card.textContent.includes("Long Form Vault") || card.textContent.includes("Short Form Lab"))) return;

      // Keep the About image panel heading static as well.
      if (el.textContent.includes("4 YEARS OF") && el.textContent.includes("CUTTING CULTURE")) return;

      el.classList.add("scroll-reveal");
    });
  }

  function setupPortfolioPageLoadAnimation() {
    /* Long Form / Short Form page: reveal the page heading and intro on page load. */
    var headings = document.querySelectorAll("#root h1");
    headings.forEach(function (heading) {
      var text = heading.textContent.replace(/\s+/g, " ").trim();
      var isPortfolioPage = text.includes("LONG FORM") || text.includes("SHORT FORM");
      if (!isPortfolioPage || heading.closest("#home")) return;

      heading.classList.add("page-load-reveal");
      heading.classList.remove("scroll-reveal", "is-visible");

      var wrapper = heading.parentElement;
      if (wrapper) {
        wrapper.querySelectorAll(":scope > p").forEach(function (p) {
          p.classList.add("page-load-reveal", "page-load-reveal-delay");
          p.classList.remove("scroll-reveal", "is-visible");
        });
      }

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          heading.classList.add("page-load-visible");
          if (wrapper) {
            wrapper.querySelectorAll(":scope > p.page-load-reveal").forEach(function (p) {
              p.classList.add("page-load-visible");
            });
          }
        });
      });
    });
  }

  function setupHeroLoadAnimation() {
    var hero = document.querySelector("#home h1");
    if (!hero) return false;

    // Hero heading animates once when the page loads, not when scrolling.
    hero.classList.add("hero-load-reveal");
    hero.classList.remove("scroll-reveal", "is-visible");
    hero.querySelectorAll(".scroll-reveal").forEach(function (el) {
      el.classList.remove("scroll-reveal", "is-visible");
    });

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        hero.classList.add("hero-load-visible");
      });
    });

    return true;
  }

  function revealOnScroll() {
    prepareTextAnimations();
    setupHeroLoadAnimation();
    setupPortfolioPageLoadAnimation();

    var elements = document.querySelectorAll(".scroll-reveal");
    var trigger = window.innerHeight * 0.88;

    elements.forEach(function (el) {
      if (el.closest("#home h1")) return;
      var rect = el.getBoundingClientRect();
      if (rect.top <= trigger) {
        el.classList.add("is-visible");
      }
    });
  }

  function startReveal() {
    prepareTextAnimations();
    setupHeroLoadAnimation();
    setupPortfolioPageLoadAnimation();
    revealOnScroll();
    window.addEventListener("scroll", revealOnScroll, { passive: true });
    window.addEventListener("resize", revealOnScroll);

    // React changes the page content without doing a full browser reload.
    // Watch #root so Long Form / Short Form page-load animation runs when visited.
    var root = document.getElementById("root");
    if (root && !root.dataset.revealRouteObserver) {
      root.dataset.revealRouteObserver = "true";
      var routeObserver = new MutationObserver(function () {
        setTimeout(function () {
          prepareTextAnimations();
          setupPortfolioPageLoadAnimation();
          revealOnScroll();
        }, 30);
      });
      routeObserver.observe(root, { childList: true, subtree: true });
    }

    var attempts = 0;
    var timer = setInterval(function () {
      revealOnScroll();
      attempts++;
      if (attempts >= 30) clearInterval(timer);
    }, 100);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startReveal);
  } else {
    startReveal();
  }
})();
</script>

<script>
(function () {
  function startCounter(el, target) {
    if (el.dataset.counterStarted === "true") return;
    el.dataset.counterStarted = "true";

    var start = 1;
    var duration = 1400;
    var startTime = null;

    function easeOut(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function tick(now) {
      if (!startTime) startTime = now;
      var progress = Math.min((now - startTime) / duration, 1);
      var value = Math.floor(start + (target - start) * easeOut(progress));
      el.textContent = value + "+";

      if (progress < 1) {
        requestAnimationFrame(tick);
      } else {
        el.textContent = target + "+";
      }
    }

    requestAnimationFrame(tick);
  }

  function setupCounters() {
    var cards = document.querySelectorAll("#root div");

    cards.forEach(function (card) {
      var label = card.querySelector("div.mt-1");
      if (!label) return;

      var text = label.textContent.trim();
      var target = null;

      if (text === "Years Experience") target = 4;
      if (text === "Projects Delivered") target = 500;
      if (text === "Happy Clients") target = 100;
      if (target === null) return;

      var numberEl = label.previousElementSibling;
      if (!numberEl || numberEl.dataset.counterReady === "true") return;

      numberEl.dataset.counterReady = "true";
      numberEl.dataset.counterTarget = String(target);
      numberEl.textContent = "1+";

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            startCounter(numberEl, target);
            observer.unobserve(numberEl);
          }
        });
      }, { threshold: 0.6 });

      observer.observe(numberEl);
    });
  }

  function initCounters() {
    setupCounters();
    var tries = 0;
    var timer = setInterval(function () {
      setupCounters();
      tries++;
      if (tries >= 30) clearInterval(timer);
    }, 150);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initCounters);
  } else {
    initCounters();
  }
})();
</script>
